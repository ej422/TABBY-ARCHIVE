(()=>{'use strict';const D=JSON.parse(document.getElementById('data').textContent);const nav=document.getElementById('nav'),results=document.getElementById('results'),heading=document.getElementById('heading'),search=document.getElementById('search');let shelf='episodes';const shelves=[['members','01 · 멤버 도서관',D.members.length],['episodes','02 · 에피소드 도서관',D.episodes.length],['relationships','03 · 멤버 관계도',D.relationships.length],['songs','04 · 음악 도서관',D.songs.length],['about','05 · 기록 안내',1]];function el(tag,cls='',txt=''){const e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e}function node(tag,cls,txt,parent){const e=el(tag,cls,txt);parent.append(e);return e}function bullets(title,arr,parent){if(!arr?.length)return;node('h3','',title,parent);const ul=node('ul','',null,parent);arr.forEach(t=>node('li','',t,ul))}function meta(e,s,more){const p=node('div','meta','',e);node('span','tag '+(s.includes('확정')?'green':s.includes('제목')?'grey':''),s,p);if(more)node('span','pill',more,p)}function source(e,s){node('p','source','출처: '+s,e)}function showDialogue(parent,label,lines,sourceText){if(!lines?.length)return;const hdr=node('div','meta','',parent);node('h3','',label,hdr);const btn=node('button','copy-dialogue','대사만 복사',hdr);btn.type='button';const panel=node('div','dialogue-box','',parent);lines.forEach(x=>{const row=node('div','dialogue-line','',panel);node('span','speaker',x.speaker,row);node('span','spoken',x.text,row)});node('p','version-note',sourceText||'당시 초안 · 최종 미확정',parent);btn.addEventListener('click',async()=>{const text=lines.map(x=>x.speaker+': '+x.text).join('\n');try{await navigator.clipboard.writeText(text);btn.textContent='복사했어요';}catch(err){const ta=document.createElement('textarea');ta.value=text;document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();btn.textContent=ok?'복사했어요':'직접 선택해서 복사해 주세요';}})}function entries(){let arr=[];if(shelf==='members')arr=D.members.map(m=>({title:m.name+' / '+m.en+' '+m.role,body:m.title+' '+m.facts.join(' ')+' '+m.traits.join(' '),build:(e)=>{node('h2','',m.name+' / '+m.en,e);node('div','small',m.role+' · '+m.title,e);meta(e,m.status);bullets('성장 배경과 확인된 사실',m.facts,e);bullets('성격과 인물 방향',m.traits,e);bullets('미정 · 추후 확정할 내용',m.open,e);source(e,m.source)}}));if(shelf==='episodes')arr=D.episodes.map((p,i)=>({title:'EP.'+String(i+1).padStart(2,'0')+' '+p.title,body:p.summary+' '+p.cast.join(' ')+' '+p.known.join(' ')+' '+(p.dialogue||[]).map(x=>x.text+' '+x.status).join(' ')+(p.dialogue_versions||[]).map(v=>v.lines.map(x=>x.text+' '+x.speaker).join(' ')).join(' ')+' '+p.unknown.join(' '),build:(e)=>{node('div','small','EPISODE · '+p.cast.join(' · '),e);node('h2','', 'EP.'+String(i+1).padStart(2,'0')+' '+p.title,e);meta(e,p.status);if(p.dialogue?.length)showDialogue(e,'당시 대사 초안',p.dialogue,p.dialogue[0].status+' · '+p.dialogue[0].source);else node('p','small','이 에피소드는 확인된 대사 원문이 없습니다.',e);(p.dialogue_versions||[]).forEach(v=>showDialogue(e,v.label,v.lines,v.status+' · '+v.source));node('h3','','줄거리·배경 (참고)',e);node('p','',p.summary,e);bullets('확인된 배경',p.known,e);bullets('원본 복구 대기',p.unknown,e);source(e,p.source)}}));if(shelf==='relationships')arr=D.relationships.map(r=>({title:r.from+' · '+r.to,body:r.detail,build:e=>{node('h2','',r.from+' ↔ '+r.to,e);meta(e,r.status);node('p','',r.detail,e)}}));if(shelf==='songs')arr=D.songs.map(p=>({title:p.title,body:p.facts.join(' '),build:e=>{node('h2','',p.title,e);meta(e,p.status);bullets('확인된 기록',p.facts,e);bullets('추가 확인 필요',p.open,e);source(e,p.source)}}));if(shelf==='about')arr=[{title:'기록 안내',body:D.note,build:e=>{node('h2','','복구본 안내',e);node('p','',D.note,e);bullets('서가 운영 원칙',['개별 멤버 설정은 멤버 도서관에만 저장합니다.','에피소드는 멤버와 관계없이 하나의 서가에 모읍니다.','미확인 세부 줄거리나 대사를 꾸며 넣지 않습니다.','새로운 이야기가 확정되면 개별 마크다운 문서를 갱신합니다.'],e);node('div','source','문서는 README.md 및 characters / episodes / music 폴더에서 수정할 수 있습니다.',e)}}];return arr}function render(){[...nav.children].forEach((b,i)=>b.classList.toggle('active',shelves[i][0]===shelf));heading.textContent=shelves.find(v=>v[0]===shelf)[1];results.replaceChildren();const q=search.value.toLocaleLowerCase().replace(/\s+/g,'').trim();let count=0;entries().forEach(a=>{const target=(a.title+' '+a.body).toLocaleLowerCase().replace(/\s+/g,'');if(q&&!target.includes(q))return;const e=node('article','entry','',results);a.build(e);count++});if(!count)node('div','empty','검색 결과가 없어요. 다른 검색어를 입력해 보세요.',results)}shelves.forEach(([id,name,count])=>{const b=node('button','navbtn','',nav);b.type='button';b.append(document.createTextNode(name));node('span','navcount',String(count),b);b.addEventListener('click',()=>{shelf=id;search.value='';render()})});search.addEventListener('input',render);render()})();
</script></body></html>
